name: Update public view data

on:
  schedule:
    - cron: '50 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: public-view-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch view count and append public CSV
        env:
          VIDEO_ID: ${{ secrets.NICO_VIDEO_ID }}
        run: |
          python - <<'PY'
          import csv, json, os, time, urllib.parse, urllib.request
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          video_id = os.environ.get("VIDEO_ID")
          if not video_id:
              raise RuntimeError("Repository secret NICO_VIDEO_ID is not configured")

          api = f"https://www.nicovideo.jp/api/watch/v3_guest/{video_id}"
          query = urllib.parse.urlencode({"actionTrackId": f"AAAAAAAAAA_{round(time.time()*1000)}"})
          req = urllib.request.Request(
              f"{api}?{query}",
              headers={
                  "User-Agent": "kikahito-public-view-data/1.0",
                  "X-Frontend-Id": "6",
                  "X-Frontend-Version": "0",
              },
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              payload = json.load(response)

          if payload.get("meta", {}).get("status") != 200:
              raise RuntimeError("NicoNico API error")

          views = int(payload["data"]["video"]["count"]["view"])
          now = datetime.now(ZoneInfo("Asia/Tokyo"))

          path = Path("data.csv")
          new_file = not path.exists()
          with path.open("a", newline="", encoding="utf-8") as f:
              w = csv.writer(f)
              if new_file:
                  w.writerow(["date", "time", "count"])
              w.writerow([now.strftime("%Y-%m-%d"), now.strftime("%H:%M"), views])
          PY
      - name: Commit update
        run: |
          git config user.name "kikahito-stat-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update public view data"
          git pull --rebase
          git push
